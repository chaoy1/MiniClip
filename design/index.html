<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniClip — 交互原型</title>
<link rel="stylesheet" href="miniclip.css">
<style>
  /* prototype-only: the notepad stands in for "whatever app still owns the focus" */
  .fp .fp-text {
    display: block;
    min-height: 60px;
    max-height: 120px;
    overflow: hidden;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .fp .fp-text:empty::before {
    content: "（在这里输入，MiniClip 不会抢走焦点）";
    color: #98A4B4;
  }
  .stage-dark .fp .fp-text:empty::before { color: #5E6B7C; }

  /* the panel hangs below the line being typed on, the way a candidate window does */
  .stage { height: 420px; }
  .stage .fp { left: 88px; top: 34px; }
  .stage .slot { left: 88px; top: 128px; }
</style>
</head>
<body>

<header class="page-head">
  <h1>MiniClip 候选框</h1>
  <p>按 Alt+V 呼出，↑↓ 选择，Enter 粘贴，Esc 关闭。候选框从不接受焦点：左侧记事本的插入符在整段操作里一直亮着。选择循环到底后从头继续。</p>
</header>

<div class="hud">
  <div class="hud-inner">
    <div class="hud-group">
      <button class="ctl ctl-strong" id="btn-open" type="button">呼出 Alt+V</button>
      <button class="ctl" id="btn-close" type="button">关闭 Esc</button>
      <button class="ctl" id="btn-enter" type="button">粘贴 Enter</button>
    </div>
    <span class="hud-sep" aria-hidden="true"></span>
    <div class="hud-group" role="group" aria-label="状态切换">
      <span class="hud-lab">状态</span>
      <button class="ctl" id="tg-empty" type="button" aria-pressed="false">空历史</button>
      <button class="ctl" id="tg-theme" type="button" aria-pressed="false">浅色</button>
      <button class="ctl" id="tg-conflict" type="button" aria-pressed="false">快捷键冲突</button>
      <button class="ctl" id="tg-long" type="button" aria-pressed="false">30 条</button>
    </div>
    <span class="hud-sep" aria-hidden="true"></span>
    <div class="hud-group" role="group" aria-label="粘贴结果">
      <span class="hud-lab">粘贴结果</span>
      <button class="ctl" id="tg-fail" type="button" aria-pressed="false">目标窗口已变化</button>
    </div>
  </div>
  <div class="hud-status" id="hud-status"></div>
</div>

<div class="stage" id="stage">
  <div class="fp" id="fp">
    <span class="fp-lab">记事本 — 未命名（焦点始终在这里）</span>
    <span class="fp-text" id="fp-text" tabindex="0" role="textbox" aria-label="示例输入框">docker compose up -d</span>
  </div>
  <div class="slot" id="slot"></div>
  <div class="stage-note" id="stage-note">400 × 260 DIP · 圆角 10 · 行高 40</div>
</div>

<div class="hud-status" id="selftest">实测：加载中…</div>

<script src="miniclip.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (s) { return document.querySelector(s); };
  var stage = $('#stage'), slot = $('#slot'), hud = $('#hud-status'), fpText = $('#fp-text');

  var state = {
    open: true, sel: 0, empty: false, theme: 'dark',
    conflict: false, long: false, fail: false, last: null
  };

  /* URL parameters exist so each state can be screenshotted without scripting
     input into a headless browser:
       index.html?open=0            start closed
       index.html?empty=1           empty history
       index.html?theme=light       light tokens
       index.html?long=1            the 30-entry list
       index.html?sel=5             preselect a row
       index.html?conflict=1        hotkey-conflict band
       index.html?fail=1            target-window-changed on Enter         */
  (function fromUrl() {
    var q = new URLSearchParams(location.search);
    if (q.has('open')) state.open = q.get('open') !== '0';
    if (q.get('empty') === '1') { state.empty = true; state.open = true; }
    if (q.get('theme') === 'light') state.theme = 'light';
    if (q.get('long') === '1') { state.long = true; state.open = true; }
    if (q.get('conflict') === '1') { state.conflict = true; state.open = true; }
    if (q.get('fail') === '1') state.fail = true;
    if (q.has('sel')) state.sel = Math.max(0, parseInt(q.get('sel'), 10) || 0);
  })();

  function items() { return state.empty ? [] : (state.long ? MC.historyFull() : MC.historyShort()); }
  function rowsShown() { return 6; }   /* 5–8 visible in the default state; 6 = 240 DIP list */

  var shell = document.createElement('div');
  shell.id = 'mc-root';
  shell.className = 'mc';
  slot.appendChild(shell);

  /* ---- rendering -------------------------------------------------------- */
  function render() {
    stage.classList.toggle('stage-dark', state.theme === 'dark');
    shell.dataset.theme = state.theme;

    var list = items();
    var foot = 'hint';
    if (state.last) foot = 'confirm';
    else if (!list.length) foot = 'empty';
    else if (state.conflict) foot = 'conflict';

    shell.innerHTML = MC.popupHtml({
      items: list,
      selected: state.sel,
      rows: rowsShown(),
      foot: foot,
      echo: state.last ? state.last.echo : '',
      fail: state.last ? state.last.fail : false,
      msg: state.last ? state.last.msg : '',
      hotkey: 'Alt+V'
    });
    shell.hidden = !state.open;

    /* keep the selected row inside the scroller without moving the panel */
    var selRow = shell.querySelector('.mc-row.is-selected');
    var scroller = shell.querySelector('.mc-list.is-scrollable');
    if (selRow && scroller && scroller.scrollHeight > scroller.clientHeight) {
      var top = selRow.offsetTop - MC.PAD, bottom = top + MC.ROW_H;
      if (top < scroller.scrollTop) scroller.scrollTop = top;
      else if (bottom > scroller.scrollTop + scroller.clientHeight) {
        scroller.scrollTop = bottom - scroller.clientHeight;
      }
    }
    updateHud();
  }

  function updateHud() {
    var n = items().length;
    hud.textContent = [
      state.open ? '候选框已打开 — 原窗口仍是焦点' : '候选框已关闭 — 所有按键交还原窗口',
      '历史 ' + n + ' 条',
      n ? '选中 ' + (state.sel + 1) + '/' + n : '选中 —',
      '主题 ' + (state.theme === 'dark' ? '深色' : '浅色'),
      state.long ? '30 条上限，滚动' : null,
      state.conflict ? '快捷键冲突' : null,
      state.fail ? '按下 Enter 会取消粘贴' : null
    ].filter(Boolean).join(' · ');

    $('#tg-empty').setAttribute('aria-pressed', String(state.empty));
    $('#tg-theme').setAttribute('aria-pressed', String(state.theme === 'light'));
    $('#tg-conflict').setAttribute('aria-pressed', String(state.conflict));
    $('#tg-long').setAttribute('aria-pressed', String(state.long));
    $('#tg-fail').setAttribute('aria-pressed', String(state.fail));
  }

  /* ---- behaviour -------------------------------------------------------- */
  function open() { state.open = true; state.last = null; state.sel = 0; render(); }
  function close() { state.open = false; state.last = null; render(); }

  function move(delta) {
    var n = items().length;
    if (!state.open) { open(); return; }
    if (!n) return;
    state.sel = (state.sel + delta + n) % n;   /* wrap-around, consistently */
    state.last = null;
    render();
  }

  function paste() {
    var n = items().length;
    if (!state.open || !n) return;
    var text = items()[state.sel].text;

    if (!state.fail) {
      /* the payload, byte for byte — this is what the real app writes to the
         clipboard and then hands to the focused control with Ctrl+V */
      fpText.textContent = text;
      fpText.animate(
        [{ opacity: 0.25 }, { opacity: 1 }],
        { duration: 160, easing: 'cubic-bezier(.2,.8,.2,1)' }
      );
    }
    state.last = {
      echo: MC.echo(text),
      fail: state.fail,
      msg: state.fail ? '目标窗口已变化' : '已回到原输入位置'
    };
    /* in the shipped app the panel is already gone by now; the band is kept
       visible here so the reviewer can read what was written to the clipboard */
    render();
  }

  /* ---- HUD wiring ------------------------------------------------------- */
  $('#btn-open').addEventListener('click', open);
  $('#btn-close').addEventListener('click', close);
  $('#btn-enter').addEventListener('click', paste);

  $('#tg-empty').addEventListener('click', function () {
    state.empty = !state.empty; state.sel = 0; state.last = null;
    if (state.empty) state.open = true;
    render();
  });
  $('#tg-theme').addEventListener('click', function () {
    state.theme = state.theme === 'dark' ? 'light' : 'dark'; render();
  });
  $('#tg-conflict').addEventListener('click', function () {
    state.conflict = !state.conflict; state.last = null;
    if (state.conflict) state.open = true;
    render();
  });
  $('#tg-long').addEventListener('click', function () {
    state.long = !state.long; state.sel = 0; state.last = null;
    if (state.long) state.open = true;
    render();
  });
  $('#tg-fail').addEventListener('click', function () {
    state.fail = !state.fail; state.last = null; render();
  });

  /* ---- keys: exactly the four the app intercepts, and Alt+V ------------- */
  document.addEventListener('keydown', function (e) {
    if (e.altKey && (e.key === 'v' || e.key === 'V' || e.code === 'KeyV')) {
      e.preventDefault();
      state.open = true; state.last = null; state.sel = 0; render();
      return;
    }
    if (!state.open) return;                              /* Normal Mode: hands off */
    if (e.target.closest && e.target.closest('button')) return;  /* don't hijack the HUD */
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); paste(); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); }
  });

  render();

  /* ---- verify the two pinned numbers in the live DOM -------------------- */
  window.addEventListener('load', function () {
    var out = MC.selfTest(document);
    $('#selftest').textContent = '实测：' + out.map(function (r) {
      return r[0] + ' = ' + r[1] + '（预期 ' + r[2] + '）';
    }).join(' · ');
  });
})();
</script>
</body>
</html>
